<!--
  Fontes do Design System — auto-hospedadas em public/fonts (servidas em
  /fonts/* via `staticDirs`). Sem CDN: funciona offline e não depende de
  terceiros.

  As famílias vêm dos tokens (`00-fontFamily`): Outfit para 7 marcas e
  Aileron para a MDC. Os componentes só declaram o NOME da família — quem
  carrega o arquivo é a aplicação (aqui, o Storybook).

  Os subsets/pesos seguem o que as escalas tipográficas usam: Outfit
  variável (100–900, latin + latin-ext) e Aileron nos pesos 400/600/700.
  Ver public/fonts/README.md para origem e licença.
-->

<style>
  /* Outfit — variável, dois subsets (mesma divisão do Google Fonts). */
  @font-face {
    font-family: 'Outfit';
    src: url('./fonts/Outfit-Variable-latin.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
      U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('./fonts/Outfit-Variable-latin-ext.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
      U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
      U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  /* Aileron — pesos estáticos (marca MDC). */
  @font-face {
    font-family: 'Aileron';
    src: url('./fonts/Aileron-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Aileron';
    src: url('./fonts/Aileron-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Aileron';
    src: url('./fonts/Aileron-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
</style>
