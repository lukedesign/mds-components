<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDS Components — Playground</title>
    <!-- Fontes do DS: mesma estratégia do Storybook (ver
         .storybook/preview-head.html e public/fonts/README.md) — arquivos
         auto-hospedados em /fonts têm prioridade; Google Fonts é o fallback
         da Outfit. A Aileron (MDC) só funciona auto-hospedada. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'Outfit';
        src: url('/fonts/Outfit-Variable.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'Aileron';
        src: url('/fonts/Aileron-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Aileron';
        src: url('/fonts/Aileron-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Aileron';
        src: url('/fonts/Aileron-Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      body { margin: 0; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
